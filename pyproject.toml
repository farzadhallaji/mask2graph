[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mask2graph"
dynamic = ["version"]
description = "Deterministic 2D/3D binary mask to topology graph and validated embedded graph extraction."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
  {name = "Farzad Hallaji"},
]
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-image>=0.22,<1",
  "PyYAML>=6,<7",
]
keywords = [
  "image-processing",
  "skeletonization",
  "graph-extraction",
  "computer-vision",
  "3d-imaging",
  "topology",
  "pslg",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://github.com/farzadhallaji/mask2graph"
Repository = "https://github.com/farzadhallaji/mask2graph"
Issues = "https://github.com/farzadhallaji/mask2graph/issues"
Changelog = "https://github.com/farzadhallaji/mask2graph/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]
interop = [
  "networkx>=3,<4",
]
viz = [
  "matplotlib>=3.8,<4",
]
notebook = [
  "matplotlib>=3.8,<4",
  "jupyterlab>=4,<5",
]
release = [
  "twine>=5,<7",
]

[project.scripts]
mask2graph = "mask2graph.cli:main"

[tool.setuptools.dynamic]
version = {attr = "mask2graph._version.__version__"}

[tool.setuptools.packages.find]
include = ["mask2graph*"]
exclude = ["tests*", "docs*", "examples*", "configs*", "notebooks*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
